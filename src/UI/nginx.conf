server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # This directory is edited live (bind-mounted in docker-compose.yml, no build step) -
    # nginx's default heuristic caching was letting browsers hang on to a stale app.js/
    # index.html after an edit, so every change needed a hard refresh to actually show up.
    location ~* \.(html|js|css)$ {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
}
