apiVersion: dapr.io/v1alpha1
kind: Component
metadata:
  name: statestore
  namespace: default
spec:
  type: state.redis
  version: v1
  metadata:
  - name: redisHost
    value: "redis:6379"
  - name: redisPassword
    value: ""
  # Dapr's default key prefix is the calling app-id, which would silently isolate
  # Gateway/DecisionEngine/PaymentService's state from each other even though they
  # share this Redis and the "invoice-{trackingId}" key convention. This system
  # deliberately shares invoice records across services, so prefixing must be off.
  - name: keyPrefix
    value: "none"
  # N3: outbox pattern. A plain SaveStateAsync followed by a separate PublishEventAsync
  # (the pre-N3 shape) can save an invoice's decision and then crash before the event
  # fires — the state says Approved/Escalated forever, but nobody downstream ever finds
  # out (the Gateway's escalation index goes stale, SSE listeners never wake up). With
  # this configured, an ExecuteStateTransactionAsync call against "statestore" both writes
  # the state *and* publishes it to outboxPublishTopic atomically — Dapr guarantees the
  # event fires if and only if the write commits. Used by DecisionEngine's automatic
  # decision path and the Gateway's manual approve/reject/request-info actions (see
  # docs/adr/005-outbox-and-bulkhead.md) instead of a bare SaveStateAsync + PublishEventAsync
  # pair. outboxPublishTopic reuses the existing "invoice.decided" topic name — the one
  # subscriber (PubSubHandlers.HandleInvoiceDecidedIndexAsync) only reads TrackingId off
  # the event and re-fetches the real invoice for everything else, so publishing the state
  # item itself (instead of the smaller DecisionResult DTO) as the event body is safe.
  - name: outboxPublishPubsub
    value: "pubsub"
  - name: outboxPublishTopic
    value: "invoice.decided"
